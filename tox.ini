[tox]
envlist = py39,py310,py311,py312
isolated_build = true

[testenv]
deps =
    pytest
    httpx
    rich
    click
    packaging
commands =
    pytest tests/ -v

[testenv:lint]
deps = pyflakes
commands = python -m pyflakes depshift/

[testenv:build]
deps = build
commands = python -m build --no-isolation
