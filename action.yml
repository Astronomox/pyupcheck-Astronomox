name: pyupcheck review
description: >-
  Comment on pull requests that change Python dependency versions (Dependabot,
  Renovate, or by hand) with the call sites each upgrade breaks and what
  `pyupcheck migrate` can fix automatically.
author: Astronomox
branding:
  icon: shield
  color: blue

inputs:
  base:
    description: Git ref to compare against. Defaults to the pull request's base commit.
    default: ""
  directory:
    description: Project directory, relative to the repository root.
    default: "."
  deep:
    description: Diff real API surfaces and count auto-fixable usages (slower, more accurate).
    default: "true"
  comment:
    description: Post (or update) a comment on the pull request.
    default: "true"
  fail-on:
    description: Fail the check on breaking, deprecated, any, or never.
    default: "never"
  annotations:
    description: Annotate each finding on its line in the PR diff.
    default: "true"
  sarif:
    description: >-
      Also write a SARIF report to this path (relative to the workspace), for
      github/codeql-action/upload-sarif. Empty to skip.
    default: ""
  python-version:
    description: Python used to run pyupcheck (not your project's Python).
    default: "3.13"
  github-token:
    description: Token for changelog lookups and for posting the comment.
    default: ${{ github.token }}

outputs:
  breaking:
    description: Number of breaking usages found.
    value: ${{ steps.review.outputs.breaking }}
  report:
    description: Path of the Markdown report.
    value: ${{ steps.review.outputs.report }}
  sarif:
    description: Path of the SARIF report, when one was requested.
    value: ${{ steps.review.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pyupcheck
      shell: bash
      # the action's own source, so @vX.Y.Z runs pyupcheck X.Y.Z
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Review dependency changes
      id: review
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASE: ${{ inputs.base || github.event.pull_request.base.sha || 'HEAD~1' }}
        DEEP: ${{ inputs.deep == 'true' && '--deep' || '--no-deep' }}
        FAIL_ON: ${{ inputs.fail-on }}
        ANNOTATE: ${{ inputs.annotations == 'true' && '--annotations' || '' }}
        SARIF: ${{ inputs.sarif }}
      run: |
        report="$RUNNER_TEMP/pyupcheck-review.md"
        sarif_args=()
        if [ -n "$SARIF" ]; then
          sarif_path="$GITHUB_WORKSPACE/$SARIF"
          sarif_args=(--sarif "$sarif_path")
          echo "sarif=$sarif_path" >> "$GITHUB_OUTPUT"
        fi
        # a revision, never an option: inputs are passed through the
        # environment and checked here before git sees them
        case "$BASE" in
          -*|*[!A-Za-z0-9_./@{}^~:+-]*) echo "::error::base is not a git revision: refusing it"; exit 2 ;;
        esac
        # the base commit must be present locally to read its dependency files
        git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin -- "$BASE"
        set +e
        # annotations go to stdout, where GitHub turns them into line comments
        pyupcheck review --base "$BASE" $DEEP --fail-on "$FAIL_ON" -o "$report" $ANNOTATE "${sarif_args[@]}"
        status=$?
        set -e
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        breaking=$(grep -oE '^\*\*[0-9]+ breaking\*\*' "$report" | grep -oE '[0-9]+' || echo 0)
        echo "breaking=$breaking" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      continue-on-error: true  # e.g. read-only tokens on Dependabot or fork PRs; the summary still has it
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.review.outputs.report }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        marker='<!-- pyupcheck-review -->'
        # only our own earlier comment: one written by the token's account
        # (a bot). Anyone can post a comment that starts with the marker, and
        # updating theirs would put the report under their name.
        me=$(gh api user --jq .login 2>/dev/null || echo "github-actions[bot]")
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select(.user.login == \"$me\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
        if grep -q '^No dependency versions changed' "$REPORT" && [ -z "$existing" ]; then
          echo "No dependency changes and no earlier comment: nothing to post."
          exit 0
        fi
        body=$(jq -Rs '{body: .}' < "$REPORT")
        if [ -n "$existing" ]; then
          echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input - > /dev/null
          echo "Updated comment $existing"
        else
          echo "$body" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null
          echo "Posted a new comment"
        fi

    - name: Fail on findings
      if: steps.review.outputs.status != '0'
      shell: bash
      env:  # never expanded into the script itself
        BREAKING: ${{ steps.review.outputs.breaking }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "pyupcheck found $BREAKING breaking usage(s) (fail-on: $FAIL_ON)"
        exit 1
