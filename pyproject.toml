[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyupcheck"
version = "0.22.0"
description = "Check if upgrading a Python dependency will break your code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "AgbaDev"}]
keywords = ["cli", "dependency", "upgrade", "migration", "breaking-changes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27.0",
    # httpx's HTTP/1.1 parser: versions before 0.16.0 have a known vulnerability (PYSEC-2026-348)
    "h11>=0.16.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "packaging>=21.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# pyupcheck explain: migration advice from the Claude API
ai = ["anthropic>=2.12"]
# pyupcheck ui: the full-screen app
ui = ["textual>=1.0"]

[project.scripts]
pyupcheck = "depshift.cli:main"

[project.urls]
Homepage = "https://astronomox.github.io/pyupcheck-Astronomox/"
Repository = "https://github.com/Astronomox/pyupcheck-Astronomox"
Issues = "https://github.com/Astronomox/pyupcheck-Astronomox/issues"

[tool.setuptools.packages.find]
include = ["depshift*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle and sorted imports (I), plus bug-prone patterns (B), modern syntax (UP),
# simpler code (SIM, C4, PIE, RET), performance (PERF) and ruff's own (RUF)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PERF", "RUF"]
ignore = [
    "PERF203",  # try/except in a loop: deliberate, one bad item must not stop the rest
    "PERF401",  # an explicit loop that appends often reads more clearly than a comprehension
    "SIM105",   # contextlib.suppress reads worse than try/except/pass here
    "RET505",   # "else after return" is often the clearer shape
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode: arrows and dashes in user-facing text are intended
]

[tool.ruff.lint.per-file-ignores]
# Textual declares BINDINGS and CSS as plain class attributes
"depshift/tui.py" = ["RUF012"]
# tests: long fixture strings, throwaway unpacking and lambda stubs are fine
"tests/*" = ["E501", "B006", "B011", "E731", "RUF012", "RUF059", "SIM115"]

[tool.coverage.run]
branch = false
omit = ["depshift/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.10"
files = ["depshift"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
