[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyupcheck"
version = "0.20.0"
description = "Check if upgrading a Python dependency will break your code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "AgbaDev"}]
keywords = ["cli", "dependency", "upgrade", "migration", "breaking-changes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27.0",
    # httpx's HTTP/1.1 parser: versions before 0.16.0 have a known vulnerability (PYSEC-2026-348)
    "h11>=0.16.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "packaging>=21.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# pyupcheck explain: migration advice from the Claude API
ai = ["anthropic>=2.12"]
# pyupcheck ui: the full-screen app
ui = ["textual>=1.0"]

[project.scripts]
pyupcheck = "depshift.cli:main"

[project.urls]
Homepage = "https://astronomox.github.io/pyupcheck-Astronomox/"
Repository = "https://github.com/Astronomox/pyupcheck-Astronomox"
Issues = "https://github.com/Astronomox/pyupcheck-Astronomox/issues"

[tool.setuptools.packages.find]
include = ["depshift*"]
