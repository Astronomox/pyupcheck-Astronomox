name: PyPI coverage

# How many of the most-downloaded PyPI packages pyupcheck can check. Needs
# network access and a while to run: monthly and on demand, not per PR.
on:
  workflow_dispatch:
    inputs:
      top:
        description: How many of the most-downloaded packages
        default: "1000"
  schedule:
    - cron: "43 5 1 * *"

# least privilege: jobs that need more ask for it themselves
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .
      - name: Measure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOP: ${{ inputs.top || '1000' }}
        run: python benchmarks/coverage.py --top "$TOP" --json coverage.json --markdown coverage.md
      - name: Summary
        if: always()
        run: test -f coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: coverage-results
          path: |
            coverage.json
            coverage.md
