name: Accuracy benchmark

# Runs real upgrades from benchmarks/cases against PyPI/GitHub, so it needs
# network access and takes a few minutes: weekly and on demand, not per PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

# least privilege: jobs that need more ask for it themselves
permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .
      - name: Run benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python benchmarks/run.py --json benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: benchmark-results
          path: benchmark.json
