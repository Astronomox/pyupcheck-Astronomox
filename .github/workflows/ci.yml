name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[ai]"
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke test CLI
        run: |
          pyupcheck --version
          pyupcheck --help

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: npm test
      - name: Package
        run: npx --yes @vscode/vsce package --out pyupcheck-vscode.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: pyupcheck-vscode
          path: editors/vscode/pyupcheck-vscode.vsix
