name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# least privilege: jobs that need more ask for it themselves
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[ai,ui]"
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke test CLI
        run: |
          pyupcheck --version
          pyupcheck --help

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Test
        run: npm test
      - name: Package
        run: npx --yes @vscode/vsce package --out pyupcheck-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pyupcheck-vscode
          path: editors/vscode/pyupcheck-vscode.vsix

  lint:
    # ruff (style, modern syntax, bug-prone patterns) and mypy (types) must be clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[ai,ui]" ruff mypy
      - name: ruff
        run: ruff check depshift tests
      - name: mypy
        run: mypy

  security:
    # static checks for insecure patterns (medium severity and up), and known
    # vulnerabilities in the exact dependency versions pyupcheck installs with
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -e ".[ai,ui]"
          python -m pip freeze --exclude-editable > installed.txt
      - name: Insecure patterns (bandit)
        run: pipx run bandit -q -r depshift -ll
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pipx run pip-audit --progress-spinner off -r installed.txt
